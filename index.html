<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ninja Parkour</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font-family:system-ui,Arial;display:flex;min-height:100vh;align-items:center;justify-content:center}
main{width:min(960px,100%);padding:12px;text-align:center}h1{margin:4px 0 8px;color:#ffd34d}
#hud{display:flex;justify-content:space-between;gap:8px;margin:8px 2px;font-weight:700}
canvas{width:100%;height:auto;background:linear-gradient(#83d7ff 0 65%,#d7f6a5 65%);border:4px solid #fff;border-radius:14px;display:block;touch-action:manipulation}
p{margin:8px 0;color:#dbeafe}.controls{display:flex;justify-content:center;gap:12px;margin-top:10px}
button{border:0;border-radius:14px;padding:13px 24px;background:#ffd34d;color:#182235;font-size:18px;font-weight:800}
</style>
</head>
<body><main>
<h1>🥷 Ninja Parkour</h1>
<div id="hud"><span id="lives">❤️❤️❤️</span><span id="score">Pièces : 0</span></div>
<canvas id="game" width="900" height="420" aria-label="Jeu Ninja Parkour"></canvas>
<p>Appuie sur l’écran ou sur SAUTER pour éviter les piques et ramasser les pièces !</p>
<div class="controls"><button id="jump">SAUTER ⬆</button><button id="restart">RECOMMENCER ↻</button></div>
</main>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');
const livesEl=document.getElementById('lives'),scoreEl=document.getElementById('score');
let ninja,obstacles,coins,score,lives,speed,frame,over,started;
function reset(){ninja={x:105,y:315,vy:0,w:42,h:58,ground:true};obstacles=[];coins=[];score=0;lives=3;speed=5;frame=0;over=false;started=true;updateHud()}
function updateHud(){livesEl.textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives);scoreEl.textContent='Pièces : '+score}
function jump(){if(over){reset();return}if(ninja.ground){ninja.vy=-14;ninja.ground=false}}
document.getElementById('jump').onclick=jump;c.onclick=jump;document.getElementById('restart').onclick=reset;
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});
function drawNinja() {
  const px = ninja.x;
  const py = ninja.y;
  const w = ninja.w;
  const h = ninja.h;

  x.save();
  x.translate(px, py);
  x.scale(w / 44, h / 62);

  // Foulard bleu flottant
  x.fillStyle = "#168cff";
  x.beginPath();
  x.moveTo(12, 12);
  x.lineTo(-12, 4);
  x.lineTo(-7, 17);
  x.lineTo(13, 19);
  x.fill();

  // Jambes
  x.fillStyle = "#07152f";
  x.fillRect(8, 38, 13, 17);
  x.fillRect(24, 38, 13, 17);

  // Bottes
  x.fillStyle = "#020817";
  x.fillRect(3, 53, 19, 7);
  x.fillRect(23, 53, 19, 7);

  // Corps
  x.fillStyle = "#102b58";
  x.beginPath();
  x.moveTo(8, 19);
  x.lineTo(36, 19);
  x.lineTo(39, 41);
  x.lineTo(5, 41);
  x.fill();

  // Bras
  x.fillStyle = "#102b58";
  x.fillRect(1, 22, 9, 19);
  x.fillRect(34, 22, 9, 19);

  // Protections des bras
  x.fillStyle = "#168cff";
  x.fillRect(1, 29, 9, 5);
  x.fillRect(34, 29, 9, 5);

  // Gants
  x.fillStyle = "#020817";
  x.fillRect(0, 38, 10, 6);
  x.fillRect(34, 38, 10, 6);

  // Ceinture bleue
  x.fillStyle = "#087bdf";
  x.fillRect(7, 37, 30, 5);
  x.fillStyle = "#70d8ff";
  x.fillRect(19, 37, 6, 5);

  // Cagoule
  x.fillStyle = "#061735";
  x.beginPath();
  x.arc(22, 15, 15, 0, Math.PI * 2);
  x.fill();

  // Partie bleue de la cagoule
  x.fillStyle = "#1264c5";
  x.beginPath();
  x.arc(22, 13, 13, Math.PI, Math.PI * 2);
  x.fill();

  // Masque
  x.fillStyle = "#07152f";
  x.fillRect(10, 15, 24, 13);

  // Bandeau bleu
  x.fillStyle = "#20a8ff";
  x.fillRect(9, 8, 26, 5);

  // Yeux blancs
  x.fillStyle = "white";
  x.fillRect(13, 16, 7, 4);
  x.fillRect(24, 16, 7, 4);

  // Pupilles
  x.fillStyle = "#020817";
  x.fillRect(17, 16, 2, 4);
  x.fillRect(27, 16, 2, 4);

  // Sourcils
  x.strokeStyle = "#020817";
  x.lineWidth = 2;
  x.beginPath();
  x.moveTo(12, 15);
  x.lineTo(20, 14);
  x.moveTo(24, 14);
  x.lineTo(32, 15);
  x.stroke();

  x.restore();
}

function drawSpike(o){x.fillStyle='#e53935';x.beginPath();x.moveTo(o.x,373);x.lineTo(o.x+22,333);x.lineTo(o.x+44,373);x.closePath();x.fill()}
function loop(){
 x.clearRect(0,0,900,420);x.fillStyle='#fff';for(let i=0;i<5;i++){let cx=(i*205-frame*0.35)%1000;x.beginPath();x.arc(cx,65,20,0,7);x.arc(cx+22,65,26,0,7);x.arc(cx+48,65,18,0,7);x.fill()}
 x.fillStyle='#438b42';x.fillRect(0,373,900,47);x.fillStyle='#286b35';for(let i=0;i<30;i++)x.fillRect((i*38-frame*speed%38),390,18,5);
 if(!over){
 frame++;speed=5+Math.min(score*.04,4);
 if(frame%95===0)obstacles.push({x:920});
 if(frame%115===40)coins.push({x:920,y:285-Math.random()*75,r:12});
 ninja.vy+=.7;ninja.y+=ninja.vy;if(ninja.y>=315){ninja.y=315;ninja.vy=0;ninja.ground=true}
 obstacles.forEach(o=>o.x-=speed);coins.forEach(o=>o.x-=speed);
 obstacles=obstacles.filter(o=>o.x>-60);coins=coins.filter(o=>o.x>-30);
 for(let o of obstacles){if(ninja.x+35>o.x+5&&ninja.x+5<o.x+39&&ninja.y+55>333){lives--;o.x=-100;updateHud();if(lives<=0)over=true}}
 for(let o of coins){let dx=(ninja.x+21)-(o.x),dy=(ninja.y+25)-o.y;if(Math.hypot(dx,dy)<34){score++;o.x=-50;updateHud()}}
 }
 obstacles.forEach(drawSpike);coins.forEach(o=>{x.fillStyle='#ffd34d';x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill();x.strokeStyle='#d18a00';x.lineWidth=4;x.stroke()});
 x.fillStyle = "blue";
x.fillRect(ninja.x, ninja.y, ninja.w, ninja.h);
 if(over){x.fillStyle='rgba(10,18,32,.72)';x.fillRect(0,0,900,420);x.fillStyle='#fff';x.textAlign='center';x.font='bold 48px system-ui';x.fillText('PARTIE TERMINÉE !',450,190);x.font='28px system-ui';x.fillText('Pièces : '+score+' — Appuie sur Recommencer',450,240)}
 requestAnimationFrame(loop)
}
reset();loop();
</script></body></html>
